[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "failure-forensics"
version = "0.1.0"
description = "Observability + automatic root-cause analysis for multi-step AI pipelines. Decorator-based span tracing, LLM-as-judge backward trace, eval-set self-growing from human-flagged failures."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "metehanulusoy", email = "ulusoy.metehan03@gmail.com" }]
keywords = [
    "ai", "llm", "observability", "tracing", "opentelemetry",
    "root-cause-analysis", "pipeline", "evaluation", "fastapi",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: FastAPI",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "email-validator>=2.1",
    "httpx>=0.27",
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "structlog>=24.1",
    "click>=8.1",
    "tenacity>=8.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "argon2-cffi>=23.1",
    "PyJWT>=2.8",
    "python-multipart>=0.0.9",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "anthropic>=0.49",
]

[project.optional-dependencies]
ui = ["streamlit>=1.32", "pandas>=2.2"]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "mypy>=1.10",
    "ruff>=0.4",
    "httpx>=0.27",
]

[project.scripts]
forensics = "forensics.cli:main"

[project.urls]
Homepage = "https://github.com/metehanulusoy/failure-forensics"
Issues = "https://github.com/metehanulusoy/failure-forensics/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/forensics"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error", "ignore::DeprecationWarning:httpx.*", "ignore::DeprecationWarning:starlette.*"]

[tool.coverage.run]
source = ["forensics"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["streamlit.*", "pandas.*", "docx.*", "pypdf.*", "anthropic.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
ignore = ["E501"]
